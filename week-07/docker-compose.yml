services:
  mongo:
    image: mongo:7
    container_name: pizzeria-week07-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: pizzeria
      MONGO_INITDB_ROOT_PASSWORD: pizzeria123
      MONGO_INITDB_DATABASE: pizzeria_auth_dev
    ports:
      - "27019:27017"
    volumes:
      - mongo_auth_data:/data/db

volumes:
  mongo_auth_data:
