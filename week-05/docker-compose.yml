services:
  db:
    image: postgres:16-alpine
    container_name: pizzeria-week05-db
    environment:
      POSTGRES_USER: pizzeria
      POSTGRES_PASSWORD: pizzeria123
      POSTGRES_DB: pizzeria_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
