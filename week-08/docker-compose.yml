services:
  mongo:
    image: mongo:7
    container_name: pizzeria-week08-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: pizzeria
      MONGO_INITDB_ROOT_PASSWORD: pizzeria123
      MONGO_INITDB_DATABASE: pizzeria_security_dev
    ports:
      - "27020:27017"
    volumes:
      - mongo_security_data:/data/db

volumes:
  mongo_security_data:
